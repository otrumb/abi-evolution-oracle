name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  validate-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.0
      - run: test "${GITHUB_REF_NAME}" = "$(cat VERSION)" && test "${GITHUB_REF_NAME}" = "v0.1.0"
      - run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go test -shuffle=on -count=1 ./...
      - run: go vet ./...
      - run: go run ./cmd/abi-evolution-oracle verify-corpus
      - run: go run ./cmd/abi-evolution-oracle score evidence evidence/gates.json
      - run: git diff --exit-code -- evidence/score.json
      - run: go run ./scripts/package-release.go "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/dist"
      - run: go run ./scripts/verify-release.go "${RUNNER_TEMP}/dist"

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.0
      - name: Verify tag and commit
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne (Get-Content VERSION -Raw).Trim()) { throw "tag/version mismatch" }
          if ($env:GITHUB_REF_NAME -ne "v0.1.0") { throw "unsupported release" }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "commit mismatch" }
      - name: Format
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "Unformatted files:`n$files" }
      - run: go mod verify
      - run: go test -shuffle=on -count=1 ./...
      - run: go vet ./...
      - run: go run ./cmd/abi-evolution-oracle verify-corpus
      - run: go run ./cmd/abi-evolution-oracle score evidence evidence/gates.json
      - run: git diff --exit-code -- evidence/score.json
      - name: Rehearse release assets
        shell: pwsh
        run: |
          go run ./scripts/package-release.go $env:GITHUB_REF_NAME "$env:RUNNER_TEMP/dist"
          go run ./scripts/verify-release.go "$env:RUNNER_TEMP/dist"

  package:
    needs: [validate-ubuntu, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.0
      - run: go run ./scripts/package-release.go "${GITHUB_REF_NAME}" dist
      - run: go run ./scripts/verify-release.go dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  release:
    needs: [validate-ubuntu, validate-windows, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-assets
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" dist/abi-evolution-oracle_0.1.0_linux_amd64.tar.gz dist/abi-evolution-oracle_0.1.0_windows_amd64.zip dist/SHA256SUMS
